<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCraft - Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center">
            <a href="index.html" class="inline-flex items-center space-x-2 transition hover:opacity-80">
                <div class="w-10 h-10 bg-amber-500 rounded-lg flex items-center justify-center text-blue-950">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M3 7a2 2 0 0 1 2-2h3V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm7-1h4V4h-4v2zM5 9v9h14V9H5z" />
                    </svg>
                </div>
                <span class="text-2xl font-black tracking-wide text-blue-950">Career<span class="text-amber-500">Craft</span></span>
            </a>
            <h2 class="mt-6 text-2xl font-extrabold text-blue-950">Sign in to your account</h2>
            <p class="mt-2 text-sm text-gray-600">Continue building your CareerCraft profile.</p>
        </div>
        <form id="loginForm" class="mt-8 space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-bold text-gray-700">Email address</label>
                    <input id="loginEmail" type="email" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-blue-900 focus:border-blue-900 sm:text-sm mt-1" placeholder="you@example.com">
                </div>
                <div>
                    <label class="text-sm font-bold text-gray-700">Password</label>
                    <input id="loginPassword" type="password" required class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-blue-900 focus:border-blue-900 sm:text-sm mt-1" placeholder="••••••••">
                </div>
            </div>
            <div id="loginStatus" class="hidden" role="status" aria-live="polite"></div>
            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-blue-950 bg-amber-500 hover:bg-amber-400 focus:outline-none transition shadow-md">
                    Sign In Securely
                </button>
            </div>
            <div class="text-center mt-4 text-sm text-gray-600">
                Don't have an account? <a href="signup.html" class="font-bold text-blue-700 hover:text-blue-900 transition">Sign up here.</a>
            </div>
        </form>
    </div>
    <script src="journey.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
