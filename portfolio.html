<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCraft - Live GitHub Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

    <header class="bg-blue-950 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" aria-label="CareerCraft home" class="inline-flex shrink-0 items-center rounded-lg bg-white px-2 py-1 transition hover:opacity-80">
                    <img src="careercraft-logo.png" alt="CareerCraft" width="2172" height="724" class="h-11 w-auto">
                </a>
                <nav class="hidden xl:flex items-center space-x-5 text-sm">
                    <a href="index.html" class="text-gray-300 hover:text-white font-medium transition">Home</a>
                    <a href="resumes.html" class="text-gray-300 hover:text-white font-medium transition">Templates</a>
                    <a href="editor.html" class="text-gray-300 hover:text-white font-medium transition">My CV</a>
                    <a href="portfolio.html" class="text-amber-500 font-bold transition">Portfolio</a>
                    <a href="pricing.html" class="text-gray-300 hover:text-white font-medium transition">Pricing</a>
                    <a href="prompts.html" class="text-gray-300 hover:text-white font-medium transition">AI Prompts</a>
                    <a href="linkedin.html" class="text-gray-300 hover:text-white font-medium transition">LinkedIn</a>
                    <a href="branding.html" class="text-gray-300 hover:text-white font-medium transition">Branding</a>
                </nav>
                <div class="flex items-center space-x-3">
                    <a id="navLoginLink" href="login.html" class="text-gray-300 hover:text-white font-medium text-sm transition">Log In</a>
                    <a id="navSignupLink" href="signup.html" class="bg-amber-500 hover:bg-amber-400 text-blue-950 font-bold text-sm px-5 py-2.5 rounded-lg transition shadow-md">Get Started</a>
                    <a id="navProfileLink" href="profile.html" class="hidden text-gray-300 hover:text-white font-medium text-sm transition">Dashboard</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-blue-950">Live Technical Portfolio Integration</h1>
            <p class="text-gray-600 text-lg mt-3 max-w-2xl mx-auto">Connecting directly to GitHub REST API to showcase real, verifiable projects.</p>
        </div>
        <form id="githubForm" class="mx-auto mb-8 flex max-w-xl gap-3">
            <label for="githubUsername" class="sr-only">GitHub username</label>
            <input id="githubUsername" required pattern="[A-Za-z0-9-]+" class="min-w-0 flex-1 rounded-xl border border-gray-300 px-4 py-3" placeholder="Enter your GitHub username">
            <button class="rounded-xl bg-blue-950 px-5 py-3 font-bold text-white hover:bg-blue-900">Show projects</button>
        </form>

        <div id="github-repos" class="grid md:grid-cols-2 gap-6">
            <div class="col-span-2 text-center py-12">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-500 mb-4"></i>
                <p class="text-gray-500 font-medium">Fetching live repositories from GitHub...</p>
            </div>
        </div>
    </main>

    <footer class="bg-blue-950 text-gray-400 py-8 text-center border-t border-blue-900 mt-auto">
        <p class="text-sm">&copy; 2026 CareerCraft South Africa.</p>
    </footer>
    <script src="journey.js"></script>
    <script type="module" src="portfolio.js"></script>
</body>
</html>
